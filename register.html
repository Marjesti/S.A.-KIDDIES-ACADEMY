<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your school workspace</title>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div id="school-brand-logo" class="school-brand-logo"></div>
      <p class="eyebrow">Get started</p>
      <h1>Set up your school</h1>
      <p class="subtitle">Create the admin account for your school's results workspace. You can add teachers afterward.</p>

      <div id="error-banner" class="error-banner"></div>

      <form id="register-form">
        <div class="field">
          <label for="schoolName">School name</label>
          <input type="text" id="schoolName" placeholder="e.g. S.A. Kiddies Academy" required>
        </div>
        <div class="field">
          <label for="adminName">Your name</label>
          <input type="text" id="adminName" placeholder="e.g. Amina Bello" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@school.edu.ng" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Create workspace</button>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html">Sign in</a></p>
      <div class="powered-by-footer">
        <img src="assets/logo.webp?v=1" alt="Royal-Marjeesti Hub">
        <span>Powered by Royal-Marjeesti Hub</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/auth.js?v=6"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', handleRegister);
    loadSchoolBrandingLogo();
  </script>
</body>
</html>
