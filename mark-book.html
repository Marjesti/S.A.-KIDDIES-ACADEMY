<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Mark Book</title>
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="stylesheet" href="css/dashboard.css?v=12">
<style>
  .teacher-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; background: var(--navy); color: #fff;
  }
  .teacher-topbar .school-line { font-size: 13px; color: #C9D0E0; }
  .teacher-topbar a {
    background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff;
    padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
    text-decoration: none;
  }
  .teacher-body { max-width: 100%; margin: 0 auto; padding: 20px 12px 60px; }

  /* ---- Mark book ---- */
  .markbook-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; gap: 10px;
  }
  .markbook-nav-btn {
    background: var(--navy); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 10px 16px; font-weight: 700; cursor: pointer; flex-shrink: 0; font-size: 14px;
  }
  .markbook-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .markbook-title { text-align: center; flex-grow: 1; }
  .markbook-title .eyebrow { margin: 0; }
  .markbook-title h2 { margin: 2px 0 0; font-size: 16px; }
  .markbook-title .progress { font-size: 12px; color: var(--text-muted); }

  .markbook-viewport { overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); background: #fff; }
  .markbook-page {
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .markbook-page.sliding-out-left { transform: translateX(-40px); opacity: 0; }
  .markbook-page.sliding-out-right { transform: translateX(40px); opacity: 0; }

  .markbook-table-wrap { max-height: 65vh; overflow: auto; }
  .markbook-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
  .markbook-table thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--navy); color: #fff; padding: 10px 8px; text-align: center;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .markbook-table thead th:first-child { text-align: left; position: sticky; left: 0; z-index: 3; }
  .markbook-table td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--border-soft); }
  .markbook-table td:first-child {
    text-align: left; font-weight: 600; position: sticky; left: 0; background: #fff; z-index: 1;
    border-right: 1px solid var(--border-soft);
  }
  .markbook-table tbody tr:nth-child(even) td:first-child { background: #FBFAF7; }
  .markbook-missing { color: #A33A3A; font-weight: 700; background: #FBEAEA; border-radius: 4px; }
  .markbook-complete { color: #3A7D44; font-weight: 700; }
</style>
</head>
<body>
  <div class="teacher-topbar">
    <div>
      <div style="font-weight:700;" id="teacher-name">Loading...</div>
      <div class="school-line" id="school-name"></div>
    </div>
    <a href="teacher-dashboard.html">Back to dashboard</a>
  </div>
  <div class="teacher-body" id="page-body"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/layout.js?v=15"></script>
  <script src="js/mark-book.js?v=1"></script>
</body>
</html>
