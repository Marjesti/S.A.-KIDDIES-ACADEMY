<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify a result</title>
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="stylesheet" href="css/dashboard.css?v=12">
<style>
  .verify-page { min-height: 100vh; padding: 32px 20px; display: flex; justify-content: center; }
  .verify-card { max-width: 520px; width: 100%; }
  .verify-card .auth-card { padding: 28px 24px; }
  .report-wrap { max-width: 720px; width: 100%; margin: 20px auto 0; }
  .report-table-scroll { overflow-x: auto; }
  .download-pdf-btn { margin-top: 14px; }
  .verification-authorities { position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin:20px 8px 8px; padding-top:12px; border-top:1px solid #d9e2df; break-inside:avoid; page-break-inside:avoid; }
  .verification-signature { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; min-width:0; text-align:center; font-size:11px; color:#243b38; }
  .verification-signature img { display:block; max-width:100%; width:auto; height:auto; max-height:56px; object-fit:contain; }
  .verification-signature .signature-line { width:100%; max-width:190px; border-top:1px solid #344b47; margin-top:3px; }
  .verification-signature strong { margin-top:4px; }
  /* Center the official stamp across the signature area, with a subtle realistic tilt. */
  .verification-stamp { position:absolute; left:50%; top:50%; z-index:2; display:flex; justify-content:center; align-items:center; width:92px; transform:translate(-50%,-50%); pointer-events:none; }
  .verification-stamp img { display:block; width:88px; height:88px; object-fit:contain; transform:rotate(-5deg); }
  @media(max-width:480px) { .verification-authorities { gap:8px; margin-left:2px; margin-right:2px; } .verification-stamp { width:70px; } .verification-stamp img { width:68px; height:68px; } .verification-signature img { max-height:44px; } }
  @media print { .verification-authorities { margin-top:10px; } .verification-stamp img { width:68px; height:68px; } .verification-signature img { max-height:40px; } }

  @media print {
    @page { size: A4; margin: 14mm; }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    body { background: #fff !important; }
    .verify-page { padding: 0; min-height: auto; display: block; }
    .lookup-card, .download-pdf-btn { display: none !important; }
    .report-wrap { max-width: 100%; margin: 0; }
  }
  .powered-by {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }
  .powered-by img { height: 22px; width: auto; }
  .powered-by span { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="verify-page" style="flex-direction: column; align-items: center;">
    <div class="verify-card lookup-card">
      <div class="auth-card">
        <p class="eyebrow">Result verification</p>
        <h1 style="margin:4px 0 6px;">Verify a result</h1>
        <p class="subtitle">Scan a QR code from a report card, or type the code printed below it.</p>

        <div class="field">
          <label for="code-input">Verification code</label>
          <input type="text" id="code-input" placeholder="Paste or type the code here">
        </div>
        <button class="btn-primary" onclick="lookupCode()">Look up result</button>

        <div id="error-banner" class="error-banner"></div>
      </div>
    </div>

    <div id="result-output" class="report-wrap"></div>

    <div class="powered-by" style="max-width:520px; width:100%;">
      <img id="verify-logo-img" src="assets/logo.webp" alt="Royal-Marjeesti Hub">
      <script>document.getElementById("verify-logo-img").src += "?cb=" + Date.now();</script>
      <span>Powered by Royal-Marjeesti Hub</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    function showError(message) {
      const el = document.getElementById('error-banner');
      el.textContent = message;
      el.classList.add('visible');
    }
    function clearError() {
      const el = document.getElementById('error-banner');
      el.textContent = '';
      el.classList.remove('visible');
    }

    function ordinal(n) {
      if (n === null || n === undefined) return '--';
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    async function lookupCode() {
      clearError();
      document.getElementById('result-output').innerHTML = '';
      const code = document.getElementById('code-input').value.trim();
      if (!code) { showError('Enter a code first.'); return; }

      const { data, error } = await supabaseClient.rpc('get_report_by_token', { p_token: code });

      if (error) {
        if (error.code === '42883' || /function.*does not exist/i.test(error.message)) {
          showError('The verification system isn\'t set up yet on this database (a required migration is missing). Ask the school admin to check this.');
        } else {
          showError('Something went wrong looking that up: ' + error.message);
        }
        return;
      }

      if (!data || !data.length) {
        showError('No published result found for that code yet. This can mean the code is wrong, or the result hasn\'t been published by the school yet.');
        return;
      }

      const first = data[0];
      const rowsHtml = data.map((r) => `
        <tr>
          <td>${r.subject_name}</td>
          <td style="text-align:center;">${r.ca_score ?? '--'}</td>
          <td style="text-align:center;">${r.exam_score ?? '--'}</td>
          <td style="text-align:center;">${r.total_score ?? '--'}</td>
          <td style="text-align:center;">${r.grade || '--'}</td>
          <td style="text-align:center;">${ordinal(r.subject_position)}</td>
          <td style="text-align:center;">${r.subject_highest ?? '--'}</td>
          <td style="text-align:center;">${r.subject_lowest ?? '--'}</td>
        </tr>
      `).join('');

      const behaviorRow = (label, val) => `<tr><td>${label}</td><td style="text-align:center;">${val ?? '--'}</td></tr>`;

      document.getElementById('result-output').innerHTML = `
        <div class="report-card" style="box-shadow:none; border:1px solid var(--border-soft);">
          <div class="report-header">
            <div class="report-logo">${first.school_logo_url ? `<img src="${first.school_logo_url}${first.school_logo_url.includes('?') ? '&' : '?'}cb=${Date.now()}" alt="logo">` : ''}</div>
            <div class="report-header-text">
              <h1>${first.school_name || 'School Name'}</h1>
              ${first.school_address ? `<p class="report-address">ADDRESS: ${first.school_address}</p>` : ''}
              ${first.school_phone ? `<p class="report-phone">Tel.: ${first.school_phone}</p>` : ''}
            </div>
          </div>
          <h2 class="report-title">REPORT SHEET</h2>
          <div class="report-meta">
            <span><strong>NAME:</strong> ${first.student_name}</span>
            <span><strong>CLASS:</strong> ${first.class_name || 'Unassigned'}</span>
            <span><strong>POSITION:</strong> ${ordinal(first.overall_position)}</span>
            <span><strong>TERM:</strong> ${first.year_label} &middot; ${first.term}</span>
          </div>

          <div class="report-table-scroll">
            <table class="report-table">
              <thead>
                <tr>
                  <th>SUBJECT</th><th>C.A</th><th>EXAM</th><th>TOTAL</th><th>GRADE</th>
                  <th>POSITION</th><th>HIGHEST</th><th>LOWEST</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>

          <div class="report-footer-grid">
            <div class="report-panel">
              <p class="report-panel-title">BEHAVIOUR</p>
              <table class="behavior-table">
                ${behaviorRow('Punctuality', first.punctuality)}
                ${behaviorRow('Attendance', first.attendance_rating)}
                ${behaviorRow('Neatness', first.neatness)}
                ${behaviorRow('Handwriting', first.handwriting)}
                ${behaviorRow('Politeness', first.politeness)}
                ${behaviorRow('Initiative', first.initiative)}
                ${behaviorRow('Attitude to school', first.attitude_to_school)}
              </table>
              <p class="report-keys">Keys: Excellent = 5, V.Good = 4, Good = 3, Average = 2, Poor = 1</p>
            </div>

            <div class="report-panel">
              <p class="report-panel-title">GRADE SYSTEM</p>
              <table class="behavior-table">
                <tr><td>90 - 100</td><td>A+</td></tr>
                <tr><td>80 - 89</td><td>A</td></tr>
                <tr><td>75 - 79</td><td>B2</td></tr>
                <tr><td>70 - 74</td><td>B3</td></tr>
                <tr><td>65 - 69</td><td>C4</td></tr>
                <tr><td>60 - 64</td><td>C5</td></tr>
                <tr><td>50 - 59</td><td>C6</td></tr>
                <tr><td>40 - 49</td><td>D7</td></tr>
                <tr><td>30 - 39</td><td>E8</td></tr>
                <tr><td>0 - 29</td><td>F9</td></tr>
              </table>
            </div>

            <div class="report-panel">
              <p class="report-panel-title">SUMMARY</p>
              <table class="behavior-table">
                <tr><td>G. Total</td><td>${first.g_total ?? '--'}</td></tr>
                <tr><td>Average</td><td>${first.student_average ? Number(first.student_average).toFixed(1) + '%' : '--'}</td></tr>
                <tr><td>Highest avg. in class</td><td>${first.class_highest_avg ? Number(first.class_highest_avg).toFixed(1) + '%' : '--'}</td></tr>
                <tr><td>Lowest avg. in class</td><td>${first.class_lowest_avg ? Number(first.class_lowest_avg).toFixed(1) + '%' : '--'}</td></tr>
              </table>
              <p class="report-panel-title" style="margin-top:12px;">ATTENDANCE</p>
              <table class="behavior-table">
                <tr><td>Days opened</td><td>${first.days_opened ?? '--'}</td></tr>
                <tr><td>Days present</td><td>${first.days_present ?? '--'}</td></tr>
                <tr><td>Days absent</td><td>${first.days_absent ?? '--'}</td></tr>
              </table>
            </div>
          </div>

          <div class="report-remarks">
            <p><strong>Headteacher/Principal's remarks:</strong> ${first.headteacher_remark || 'Not yet recorded.'}</p>
            <p><strong>Teacher's remark:</strong> ${first.teacher_remark || 'Not yet recorded.'}</p>
          </div>
          ${(() => {
            const classLabel = String(first.class_name || '').toLowerCase();
            const isPrimary = classLabel.includes('primary') || classLabel.includes('nursery') || classLabel.includes('pre-nursery') || classLabel.includes('playgroup') || classLabel === 'nur';
            const signatureLabel = isPrimary ? 'Headteacher' : 'Principal';
            const signatureUrl = isPrimary
              ? (first.headteacher_signature_url || 'assets/head-teacher.png')
              : (first.principal_signature_url || 'assets/principal.png');
            const stampUrl = first.school_stamp_url || first.stamp_url || 'assets/sak-original-stamp.png';
            const cacheBust = (url) => `${url}${String(url).includes('?') ? '&' : '?'}cb=${Date.now()}`;
            return `<div class="verification-authorities">
              <div class="verification-signature">
                <img src="${cacheBust(signatureUrl)}" alt="${signatureLabel} signature" onerror="this.style.display='none'">
                <div class="signature-line"></div>
                <strong>${signatureLabel}'s Signature</strong>
              </div>
              <div class="verification-stamp"><img src="${cacheBust(stampUrl)}" alt="School official stamp" onerror="this.style.display='none'"></div>
            </div>`;
          })()}
        </div>

        <button class="btn-primary download-pdf-btn" onclick="window.print()">Download as PDF</button>
      `;
    }

    // If opened via a QR scan (?token=...), look it up automatically
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (token) {
        document.getElementById('code-input').value = token;
        lookupCode();
      }
    })();
  </script>
</body>
</html>
