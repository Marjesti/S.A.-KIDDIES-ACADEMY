<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password</title>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div id="school-brand-logo" class="school-brand-logo"></div>
      <p class="eyebrow">Account recovery</p>
      <h1>Forgot your password?</h1>
      <p class="subtitle">Enter your login email and we'll send a link to reset it.</p>

      <div id="error-banner" class="error-banner"></div>
      <div id="success-banner" class="error-banner" style="background:#E8F3EA; color:#3A7D44;"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@school.edu.ng" required>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Send reset link</button>
      </form>

      <p class="form-footer"><a href="login.html">Back to sign in</a></p>
      <div class="powered-by-footer">
        <img src="assets/logo.webp?v=1" alt="Royal-Marjeesti Hub">
        <span>Powered by Royal-Marjeesti Hub</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/auth.js?v=6"></script>
  <script>
    loadSchoolBrandingLogo();
    document.getElementById('forgot-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errEl = document.getElementById('error-banner');
      const okEl = document.getElementById('success-banner');
      errEl.classList.remove('visible'); okEl.classList.remove('visible');

      const button = document.getElementById('submit-btn');
      button.disabled = true;
      button.textContent = 'Sending...';

      const email = document.getElementById('email').value.trim();
      const redirectTo = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

      button.disabled = false;
      button.textContent = 'Send reset link';

      if (error) {
        errEl.textContent = error.message;
        errEl.classList.add('visible');
        return;
      }
      okEl.textContent = 'If that email has an account, a reset link has been sent. Check your inbox (and spam folder).';
      okEl.classList.add('visible');
    });
  </script>
</body>
</html>
